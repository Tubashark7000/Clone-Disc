<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'self'" />
    <title>Compartilhar tela</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; background: #282a2f; color: #e7e9ee; font-family: system-ui, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
      header { padding: 16px 20px 8px; }
      h1 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
      header p { margin: 0; color: #9aa0ab; }
      h2 { margin: 14px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #9aa0ab; }
      #list { flex: 1; overflow-y: auto; padding: 0 20px 12px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
      .grid > * { min-width: 0; }
      .item { display: flex; flex-direction: column; gap: 6px; min-width: 0; width: 100%; overflow: hidden; padding: 8px; background: #202226; border: 2px solid transparent; border-radius: 8px; color: inherit; font: inherit; text-align: left; cursor: pointer; }
      .item:hover { background: #2a2c32; }
      .item[aria-pressed="true"] { border-color: #6d6ff5; background: #2a2c32; }
      .item:focus-visible { outline: 2px solid #e7e9ee; outline-offset: 2px; }
      .item img.thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #17181b; border-radius: 4px; }
      .label { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .label img { width: 16px; height: 16px; flex: none; }
      .label span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      footer { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: #202226; border-top: 1px solid #15161a; }
      .audio { display: flex; flex-direction: column; flex: 1; min-width: 0; }
      .audio label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      .audio small { margin: 2px 0 0 24px; color: #9aa0ab; }
      .audio.off { opacity: 0.5; }
      button.btn { border: 0; border-radius: 6px; padding: 9px 20px; font: inherit; font-weight: 500; cursor: pointer; }
      button.btn:focus-visible { outline: 2px solid #e7e9ee; outline-offset: 2px; }
      #cancel { background: #34373d; color: #e7e9ee; }
      #share { background: #6d6ff5; color: #fff; }
      #share:disabled { opacity: 0.4; cursor: default; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <h1>Compartilhar tela</h1>
      <p>Escolha uma tela inteira ou uma janela.</p>
    </header>
    <div id="list"></div>
    <footer>
      <div class="audio" id="audioBox" hidden>
        <label><input type="checkbox" id="audio" /> Compartilhar o som do computador</label>
        <small>Inclui as vozes da chamada: quem assiste pode ouvir a si mesmo (eco). Prefira deixar desmarcado para falar com a turma.</small>
      </div>
      <span style="flex: 1" id="spacer"></span>
      <button class="btn" id="cancel" type="button">Cancelar</button>
      <button class="btn" id="share" type="button" disabled>Compartilhar</button>
    </footer>
    <script src="picker.js"></script>
  </body>
</html>
